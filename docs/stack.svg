<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7ddc8b"/></marker>
  </defs>
  <style>
    .h { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .n { font-size: 11px; font-weight: 700; fill: #e6edf3; }
    .d { font-size: 9.5px; fill: #8a9bb4; }
    .m { font-size: 9px; fill: #5d6675; font-family: SFMono-Regular,Menlo,monospace; }
  </style>

  <rect width="880" height="490" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="489" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">FOUR WAYS TO FIND A PEER, ONE QUEUE TO DIAL THEM</text>
  <text x="852" y="38" class="m" text-anchor="end">every layer hand-rolled</text>

  <!-- discovery sources -->
  <text x="28" y="70" class="h" fill="#5fd0de">DISCOVERY</text>

  <rect x="28" y="80" width="190" height="72" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
  <text x="44" y="100" class="n">trackers</text>
  <text x="204" y="100" class="m" text-anchor="end">BEP 3 · 15</text>
  <text x="44" y="118" class="d">HTTP · HTTPS · UDP</text>
  <text x="44" y="132" class="d">IPv4 and IPv6</text>
  <text x="44" y="146" class="m">random txn ids guard UDP</text>

  <rect x="230" y="80" width="190" height="72" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
  <text x="246" y="100" class="n">mainline DHT</text>
  <text x="406" y="100" class="m" text-anchor="end">BEP 5</text>
  <text x="246" y="118" class="d">Kademlia routing table,</text>
  <text x="246" y="132" class="d">iterative get_peers</text>
  <text x="246" y="146" class="m">answers inbound queries too</text>

  <rect x="432" y="80" width="190" height="72" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
  <text x="448" y="100" class="n">PEX</text>
  <text x="608" y="100" class="m" text-anchor="end">BEP 11</text>
  <text x="448" y="118" class="d">peers gossip the peers</text>
  <text x="448" y="132" class="d">they already know</text>

  <rect x="634" y="80" width="218" height="72" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
  <text x="650" y="100" class="n">web seeds</text>
  <text x="838" y="100" class="m" text-anchor="end">BEP 19</text>
  <text x="650" y="118" class="d">plain ranged HTTP GETs —</text>
  <text x="650" y="132" class="d">a swarm of one, always up</text>

  <!-- queue -->
  <path d="M123 152 V 176" stroke="#6b7688" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M325 152 V 176" stroke="#6b7688" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M527 152 V 176" stroke="#6b7688" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M743 152 V 176" stroke="#6b7688" stroke-width="1.3" marker-end="url(#a)"/>

  <rect x="28" y="180" width="824" height="40" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="440" y="198" class="n" text-anchor="middle">one dial queue</text>
  <text x="440" y="213" class="d" text-anchor="middle">deduplicated, capped at --peers, and IPv6 addresses are skipped outright when the host has no v6 route</text>

  <!-- peer protocol -->
  <text x="28" y="250" class="h" fill="#a78bfa">THE WIRE</text>
  <rect x="28" y="260" width="398" height="96" rx="8" fill="#12151b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="44" y="280" class="n">peer protocol, one thread per connection</text>
  <text x="44" y="300" class="d">handshake → bitfield → interested → pipelined block requests</text>
  <text x="44" y="316" class="d">every piece SHA-1 verified before a byte reaches the disk</text>
  <text x="44" y="336" class="m">magnet links fetch the info dict from peers first — BEP 9/10</text>
  <text x="44" y="350" class="m">a trackerless magnet bootstraps entirely from the DHT</text>

  <!-- selection -->
  <rect x="438" y="260" width="414" height="96" rx="8" fill="#12151b" stroke="#7ddc8b" stroke-width="1.2"/>
  <text x="454" y="280" class="n">rarest first, then endgame</text>
  <text x="454" y="300" class="d">The scarcest piece in the swarm is requested first, so the</text>
  <text x="454" y="314" class="d">rare ones don't vanish while everyone trades common ones.</text>
  <text x="454" y="334" class="d">For the tail, every capable peer is asked for the last pieces at</text>
  <text x="454" y="348" class="d">once — first verified copy wins, stragglers cancelled.</text>

  <path d="M227 220 V 256" stroke="#6b7688" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M426 308 H 434" stroke="#7ddc8b" stroke-width="1.3" marker-end="url(#ag)"/>

  <!-- bottom row -->
  <text x="28" y="386" class="h" fill="#f0b866">AND THEN</text>

  <rect x="28" y="396" width="264" height="66" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
  <text x="44" y="416" class="n">resume</text>
  <text x="44" y="434" class="d">An interrupted run re-hashes what's on</text>
  <text x="44" y="448" class="d">disk. A stale progress file is never trusted.</text>

  <rect x="308" y="396" width="264" height="66" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
  <text x="324" y="416" class="n">seeding</text>
  <text x="324" y="434" class="d">Serves verified pieces during and after</text>
  <text x="324" y="448" class="d">the download. Real numbers to trackers.</text>

  <rect x="588" y="396" width="264" height="66" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
  <text x="604" y="416" class="n">behind a router</text>
  <text x="604" y="434" class="d">Best-effort UPnP and NAT-PMP mapping —</text>
  <text x="604" y="448" class="d">the latter hand-rolled, since nothing had it.</text>
</svg>
