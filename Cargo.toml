[package]
name = "bittorrent-rs"
version = "0.1.0"
edition = "2021"
# Floor set by the locked dependency graph (darling 0.23 and instability
# 0.3, pulled in by ratatui, need 1.88); CI's `msrv` job builds with it.
rust-version = "1.88"
# `cargo run` maps to the client; the others are helpers (create_torrent,
# e2e_harness, infohash).
default-run = "download"

[dependencies]
sha1 = "0.10"
# Ed25519 signatures for BEP 44 mutable DHT items. The one crypto primitive in this
# project not hand-rolled from the spec: unlike SHA-1/SHA-256/RC4, getting elliptic-curve
# signature verification wrong is a real security hazard, not just a correctness bug, so
# this uses a vetted implementation instead (verified against BEP 44's own published test
# vectors in src/dht/store.rs, the same way everything hand-rolled here is verified).
ed25519-dalek = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"
# Terminal UI for the `download` binary's live dashboard. Pulls in
# crossterm (re-exported as `ratatui::crossterm`), which is the only
# terminal backend used -- no separate crossterm dependency needed.
ratatui = "0.29"
# Optional TOML config file (~/.config/bittorrent-rs.toml) for default flags.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# UPnP IGD port mapping (NAT-PMP is hand-rolled in src/portmap.rs).
igd-next = "0.15"
# Cryptographically-secure OS RNG, used for UDP tracker transaction ids
# (the anti-spoofing guard for connectionless BEP 15 exchanges).
getrandom = "0.2"
# Synchronous HTTP client for BEP 19 web seeds (ranged GETs). rustls-based,
# no async runtime -- fits the one-thread-per-source model.
ureq = "2"

# Signal handling on Unix (already in the tree via sha1 and crossterm).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# hazmat's raw_sign lets a test reproduce BEP 44's own published signature test vectors exactly,
# whose "private key" is given in the pre-expanded (scalar||prefix) form those vectors use rather
# than the ordinary 32-byte seed `SigningKey` takes; production code never touches this module.
ed25519-dalek = { version = "2", features = ["hazmat"] }
sha2 = "0.10"

[lib]
name = "bittorrent_rs"
path = "src/lib.rs"
